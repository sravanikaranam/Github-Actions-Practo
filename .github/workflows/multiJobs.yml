name : multiple_jobs

on : workflow_dispatch


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: echo "Building...."

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: echo "Testing...."

  deploy:
    needs: test
    runs-on: ubuntu-18.04
    steps:
      - name: Deploy
        run: echo "Deploying...."